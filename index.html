<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#172e39"><title>真如苑經文跟讀 V1.0</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f5f5f0;color:#182e36}header{background:#172e39;color:white;padding:22px 18px 18px}header h1{font-size:23px;margin:0 0 5px}header small{color:#c9d5d7}main{max-width:760px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000b}h2{font-size:17px;margin:0 0 12px}button{border:1px solid #c7d3d4;border-radius:12px;background:white;padding:12px 10px;font-size:16px;color:#18343e;cursor:pointer}.active{background:#184b57;color:white;border-color:#184b57}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}img{display:block;max-width:100%;height:auto;margin:auto;border-radius:7px}audio{width:100%;margin:12px 0}p{line-height:1.65}.muted{color:#60747b;font-size:13px}.status{font-weight:600}.bar{height:10px;background:#e7ecee;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#2b8b7c;transition:width .1s}.pill{display:inline-block;background:#fff0c9;border-radius:7px;padding:3px 7px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;color:#718188;font-size:12px;padding:14px}</style></head><body><header><h1>真如苑經文跟讀</h1><small>V1.0｜四部經文・錄音播放・麥克風測試</small></header><main><section><h2>選擇經文 <span class="pill">手動選經</span></h2><div class="choices" id="choices"></div></section><section><h2 id="title">01. 三禮</h2><p class="muted">經文圖片取自你提供的照片；可用雙指縮放瀏覽器頁面。</p><img id="page" src="assets/01.jpg" alt="經文原始照片"><audio id="player" controls preload="none" src="assets/01.mp3"></audio><p class="muted">請先確認照片、錄音是否正確對應。</p></section><section><h2>手機麥克風測試</h2><p class="muted">這個功能只測試手機能否收音，<strong>尚不會辨識或切換經文</strong>。請使用 HTTPS 網址開啟並允許麥克風權限。</p><div class="row"><button id="start">開始收音</button><button id="stop" disabled>停止收音</button></div><p class="status" id="status" aria-live="polite">尚未開始</p><div class="bar"><div class="fill" id="meter"></div></div></section><section><h2>下一版開發重點</h2><p>建立四部經文的聲音特徵，辨識目前正在念誦哪一部經文，並自動切換畫面；之後再開發逐句追蹤。</p></section></main><footer>個人測試原型｜未提供錄音上傳或背景收音</footer><script>const data=[['三禮','01'],['總禮文','02'],['三歸依文','03'],['五戒文','04']];const choices=document.getElementById('choices'),page=document.getElementById('page'),player=document.getElementById('player'),title=document.getElementById('title');let selected=0;data.forEach(([name,n],i)=>{let b=document.createElement('button');b.textContent=n+'. '+name;b.onclick=()=>{selected=i;title.textContent=n+'. '+name;page.src='assets/'+n+'.jpg';player.pause();player.src='assets/'+n+'.mp3';update()};choices.append(b)});function update(){[...choices.children].forEach((b,i)=>b.classList.toggle('active',i===selected))}update();let stream,ctx,analyser,raf;const status=document.getElementById('status'),meter=document.getElementById('meter'),start=document.getElementById('start'),stop=document.getElementById('stop');start.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new(window.AudioContext||window.webkitAudioContext)();const source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=1024;source.connect(analyser);const arr=new Uint8Array(analyser.fftSize);status.textContent='麥克風收音中（僅顯示音量）';start.disabled=true;stop.disabled=false;function draw(){analyser.getByteTimeDomainData(arr);let sum=0;for(const x of arr){const v=(x-128)/128;sum+=v*v}const rms=Math.sqrt(sum/arr.length);meter.style.width=Math.min(100,Math.round(rms*400))+'%';raf=requestAnimationFrame(draw)}draw()}catch(e){status.textContent='無法收音：請確認 Safari 麥克風權限及 HTTPS 連線。'}};stop.onclick=()=>{cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();meter.style.width='0%';status.textContent='已停止收音';start.disabled=false;stop.disabled=true};</script></body></html>
